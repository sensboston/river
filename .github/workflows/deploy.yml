name: Deploy HTML Game to GitHub Pages

on:
  push:
    branches: ["master"]
  # Allows manually triggering the deployment from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build and check job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Optional build steps for bundled projects (e.g., Vite, Webpack, npm scripts):
      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '22'
      # - name: Install dependencies
      #   run: npm ci
      # - name: Build static assets
      #   run: npm run build

      # The service worker is cache-first, so the cache name has to change on
      # every deploy or returning players keep the old build. tools/build.mjs
      # writes dist/ and stamps sw.js with the commit id.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the site
        run: |
          node tools/check.mjs
          node tools/smoke.mjs
          node tools/build.mjs

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Only the deployable site: docs, tools and CI never reach Pages.
          path: './dist'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
